# Deliberately CHOSEN values — the counterpart to calibration.properties.
#
# calibration.properties is measured from ~36,000 real matches and must never be hand-edited.
# This file is where the game is allowed to disagree with reality, on purpose, with a reason.
# See com.draft.footy.GameBalance.

# Multiplier on the measured form spread (calibration.properties form.sigma = 3.52 rating points).
#
# 1.40 is the REALISTIC setting, not a taste choice. The analytical figure is derived in log-goal
# units and then converted to rating points, but that conversion passes through two different
# scales (attack 20.1, defence 26.6) and then through Dixon-Coles sampling, so it lands slightly
# short. Calibrating empirically against real league tables closes the gap:
#
#   multiplier   simulated spread sd   real
#      1.0             15.3            16.9
#      1.40            17.1            16.9   <- matches
#      1.8             18.7            16.9
#
# Verify with:  java -cp target/classes com.draft.footy.HistoricalValidation
#
# Below 1.40 the game is calmer than football: seasons swing less and a good draft shows up more
# reliably in the table. That is the playability trade, and it belongs here rather than as a
# quiet edit to the measured value.
form.sigma.multiplier=1.40

# Ceiling on one team's expected goals in a match. A design clamp, not physics: the draft can
# produce 90-vs-58 mismatches that never occur in a real league, so the fit says nothing about
# them and the exponential would run away.
max.lambda=2.5
