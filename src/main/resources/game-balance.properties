# Deliberately CHOSEN values — the counterpart to calibration.properties.
#
# calibration.properties is measured from ~36,000 real matches and must never be hand-edited.
# This file is where the game is allowed to differ from the raw measurement, on purpose, with a
# reason. See com.draft.footy.GameBalance.
#
# Verify any change with:
#   mvn -q compile && java -cp target/classes com.draft.footy.HistoricalValidation


# ---------------------------------------------------------------------------------------------
# De-shrink the fitted scales.  0 = use them as measured, 1 = full correction (SCALE x sqrt(R2)).
#
# The bridge regression predicts a CONDITIONAL MEAN. A predictor explaining R2 of the variance
# necessarily produces predictions carrying only sqrt(R2) of the true spread — so straight from the
# fit, every team looks more alike than real teams are. That is correct for forecasting one team
# and wrong for generating a league, and it previously had to be papered over by inflating
# FORM_SIGMA, which left the engine under-confident about who was better AND over-random within a
# season: two errors that cancelled in the table while both being individually wrong.
#
#   attack   20.054 x sqrt(0.629) = 15.91
#   defence  26.599 x sqrt(0.439) = 17.62
#
# (Both land either side of 16.5, the value originally reached by hand — which makes sense, since
# hand-tuning was judged on whether the LEAGUE looked right, the generative objective.)
#
# Measured against 7 real league-seasons, this is better on every axis, not a trade:
#
#                          deshrink 0 / mult 1.40     deshrink 1 / mult 0.70
#   per-team spread              14.72                      11.35     (real: under 10.25)
#   error vs real results        11.14                      10.25     (lower is better)
#   league table spread          17.0                       16.9      (real: 16.9)
scale.deshrink=1.0


# Multiplier on the measured form spread (calibration.properties form.sigma = 3.52 rating points).
#
# With the scales de-shrunk the systematic spread is correct on its own, so this no longer has to
# be inflated to compensate — it drops from 1.40 to 0.70 and now represents roughly the real
# season-to-season variation rather than a fudge covering a compressed signal.
#
#   multiplier   table spread   real     per-team spread
#      0.60          16.5       16.9          10.46
#      0.70          16.9       16.9          11.35   <- chosen
#      0.85          17.5       16.9          12.59
#
# One consequence worth knowing: big over-achievements get rarer. A team finishing 25+ points above
# its own expected total happens in 1.4% of team-seasons here, against 4.5% before. Leicester 15/16
# is still reachable — roughly one such season every three or four league-years — just no longer
# routine, which is closer to how often football actually produces one.
#
# Lower this for a calmer game where a good draft shows up more reliably in the table. That is the
# playability trade, and it belongs here rather than as a quiet edit to a measured value.
form.sigma.multiplier=0.70


# Ceiling on one team's expected goals in a match. A design clamp, not physics: the draft can
# produce 90-vs-58 mismatches that never occur in a real league, so the fit says nothing about
# them and the exponential would run away.
max.lambda=2.5
