# Development-only overrides.  Activate with:
#     mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
# Kept out of the default profile so that a deployed build can never accidentally expose these.

# Web SQL client over the seeded H2 database — http://localhost:8080/h2-console
# JDBC URL jdbc:h2:mem:footy, user sa, no password.
spring.h2.console.enabled=true
