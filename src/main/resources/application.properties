server.port=8080

# Data sources (comma-separated), seeded into H2 at startup. A bare path = sofifa multi-edition export
# (fc_24.csv spans FIFA 15–FC 24); `path:NN` = the newer EA-FC ratings-export schema for edition NN.
# Missing files are skipped; a 2nd bare path (e.g. male_players_all) is ignored to avoid duplicate editions.
footy.data.csv=data/fc_24.csv,data/fc_25.csv:25,data/EAFC26-Men.csv:26,data/male_players_all.csv

# Embedded H2 + JPA (DESIGN_SPEC §16) — cert practice, not perf. Schema is created and seeded each boot.
spring.datasource.url=jdbc:h2:mem:footy;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Batch the ~27k player inserts so seeding stays quick.
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
# Browse the seeded data at http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:footy)
spring.h2.console.enabled=true
