server.port=8080

# Phase 1b: multi-edition ingest — the combined FIFA 15–23 export (per-row fifa_version).
# A legacy single-season file (e.g. players_22.csv) also loads via the same schema-flexible loader.
# DataSeeder parses this CSV once at startup and seeds it into H2 via JPA.
footy.data.csv=data/male_players_all.csv

# Embedded H2 + JPA (DESIGN_SPEC §16) — cert practice, not perf. Schema is created and seeded each boot.
spring.datasource.url=jdbc:h2:mem:footy;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Batch the ~27k player inserts so seeding stays quick.
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
# Browse the seeded data at http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:footy)
spring.h2.console.enabled=true
