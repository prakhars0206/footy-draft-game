server.port=8080

# Data sources (comma-separated), seeded into H2 at startup; an earlier file wins any season a later one repeats.
# A bare path = sofifa multi-edition export; `path:NN` = the newer EA-FC ratings-export schema for edition NN.
# male_players_all (clean FIFA 15–23) leads; fc_24 is a messier dump used only for its unique 2023/24 season
# (its scrambled league_id/name cols are reconciled in FifaDataLoader.isTop5); then modern FC 25/26.
footy.data.csv=data/male_players_all.csv,data/fc_24.csv,data/fc_25_sofifa.csv:25,data/EAFC26-Men.csv:26,data/Scraped_data_new/fifa_07.csv:7,data/Scraped_data_new/fifa_08.csv:8,data/Scraped_data_new/fifa_09.csv:9,data/Scraped_data_new/fifa_10.csv:10,data/Scraped_data_new/fifa_11.csv:11,data/Scraped_data_new/fifa_12.csv:12,data/Scraped_data_new/fifa_13.csv:13,data/Scraped_data_new/fifa_14.csv:14

# Embedded H2 + JPA (DESIGN_SPEC §16). The dataset fits in memory; the point is to exercise the
# persistence layer, not performance. Schema is created and seeded each boot.
spring.datasource.url=jdbc:h2:mem:footy;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Batch the ~27k player inserts so seeding stays quick.
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
# Browse the seeded data at http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:footy)
spring.h2.console.enabled=true
